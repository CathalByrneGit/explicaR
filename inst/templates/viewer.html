<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #4A90D9;
      --green:  #7ED321;
      --orange: #F5A623;
      --purple: #9B59B6;
      --dark:   #1a1a2e;
      --bg:     #f8f9fa;
      --border: #dee2e6;
      --muted:  #6c757d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    .ex-header {
      background: var(--dark);
      color: #fff;
      padding: .75rem 1.25rem;
      border-bottom: 3px solid var(--blue);
      flex: 0 0 auto;
    }
    .ex-header h1 { font-size: 1.25rem; font-weight: 700; }
    .ex-stats {
      font-size: .8rem;
      color: #aab;
      margin-top: .2rem;
    }

    /* ── Main two-panel layout ── */
    .ex-main {
      display: flex;
      flex: 1 1 0;
      overflow: hidden;
    }

    .ex-graph-panel {
      flex: 0 0 60%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border);
      background: #fff;
      overflow: hidden;
    }

    .ex-detail-panel {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .ex-panel-title {
      font-size: .85rem;
      font-weight: 700;
      color: var(--dark);
      padding: .5rem .85rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
      flex: 0 0 auto;
    }

    /* ── Mermaid graph container ── */
    #ex-graph-wrap {
      flex: 1 1 0;
      overflow: auto;
      padding: .5rem;
    }
    #ex-graph-wrap .mermaid {
      min-height: 100%;
    }

    /* ── Detail panel ── */
    #ex-detail-wrap {
      flex: 1 1 0;
      overflow-y: auto;
      padding: .75rem;
    }

    .ex-hint {
      font-size: .82rem;
      color: var(--muted);
      font-style: italic;
      padding: .5rem 0;
    }

    .ex-node-meta {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .75rem;
      margin-bottom: .75rem;
    }
    .ex-node-meta h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: .35rem;
    }
    .ex-meta-row {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .ex-badge {
      display: inline-block;
      padding: .1rem .4rem;
      border-radius: 3px;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-right: .3rem;
    }
    .ex-badge-script   { background: var(--blue);   color: #fff; }
    .ex-badge-variable { background: var(--green);  color: #fff; }
    .ex-badge-fn       { background: var(--orange); color: #000; }
    .ex-badge-source   { background: var(--purple); color: #fff; }

    /* ── Animation / before-after tables (from animate.R) ── */
    .explicar-animation { padding: .25rem 0; }
    .explicar-verb-title {
      font-size: .95rem;
      font-weight: 700;
      margin-bottom: .6rem;
    }
    .explicar-before-after {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .explicar-before, .explicar-after { flex: 1 1 240px; }
    .explicar-arrow {
      font-size: 1.6rem;
      color: var(--blue);
      align-self: center;
      flex: 0 0 auto;
    }
    .explicar-caption {
      font-weight: 700;
      font-size: .82rem;
      margin-bottom: .2rem;
    }
    .explicar-table {
      border-collapse: collapse;
      font-size: .78rem;
      width: 100%;
    }
    .explicar-table th,
    .explicar-table td {
      border: 1px solid var(--border);
      padding: .2rem .45rem;
      text-align: left;
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .explicar-table thead { background: #e9ecef; font-weight: 700; }
    .explicar-truncated {
      font-size: .72rem;
      color: var(--muted);
      margin-top: .2rem;
    }
    .explicar-no-data {
      font-size: .8rem;
      color: #aaa;
      font-style: italic;
    }

    /* ── Footer ── */
    .ex-footer {
      flex: 0 0 auto;
      padding: .35rem 1rem;
      font-size: .72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: #fff;
      text-align: center;
    }
    .ex-footer a { color: var(--blue); text-decoration: none; }

    /* ── Legend strip ── */
    .ex-legend {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      padding: .35rem .85rem;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      flex: 0 0 auto;
    }
    .ex-legend-item {
      font-size: .72rem;
      display: flex;
      align-items: center;
      gap: .3rem;
    }
    .ex-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    @media (max-width: 700px) {
      .ex-main { flex-direction: column; }
      .ex-graph-panel { flex: 0 0 50vh; border-right: none; border-bottom: 2px solid var(--border); }
    }
  </style>
</head>
<body>

<header class="ex-header">
  <h1>{{TITLE}}</h1>
  <p class="ex-stats">{{STATS}}</p>
</header>

<main class="ex-main">

  <section class="ex-graph-panel">
    <div class="ex-panel-title">
      Pipeline Graph
      <span style="font-weight:400;color:var(--muted);margin-left:.5rem">
        — click a node for details
      </span>
    </div>
    <div class="ex-legend">
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#4A90D9"></span>Script
      </span>
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#7ED321"></span>Variable
      </span>
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#F5A623"></span>Function
      </span>
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#9B59B6"></span>Source file
      </span>
    </div>
    <div id="ex-graph-wrap">
      <div class="mermaid" id="ex-graph">
{{MERMAID_GRAPH}}
      </div>
    </div>
  </section>

  <section class="ex-detail-panel">
    <div class="ex-panel-title" id="ex-detail-title">Detail Panel</div>
    <div id="ex-detail-wrap">
      <p class="ex-hint">Click a node in the graph to see details here.</p>
    </div>
  </section>

</main>

<footer class="ex-footer">
  Generated by
  <a href="https://github.com/CathalByrneGit/explicaR">explicaR</a>
  &nbsp;&middot;&nbsp; {{GENERATED_AT}}
</footer>

<!-- Embedded data -->
<script type="application/json" id="ex-verb-data">{{VERB_DATA_JSON}}</script>
<script type="application/json" id="ex-node-data">{{NODE_DATA_JSON}}</script>
<script type="application/json" id="ex-id-map">{{ID_MAP_JSON}}</script>

<!-- Mermaid.js (requires internet connection to render the graph) -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

<script>
(function () {
  "use strict";

  // ── Data ──────────────────────────────────────────────────────────────────
  function loadJSON(id) {
    var el = document.getElementById(id);
    if (!el) return {};
    try { return JSON.parse(el.textContent); } catch (e) { return {}; }
  }

  var verbData = loadJSON("ex-verb-data");   // { "filter@clean.R:5": "<html>" }
  var nodeData = loadJSON("ex-node-data");   // [ { name, type, file, line, ... } ]
  var idMap    = loadJSON("ex-id-map");      // { "Mermaid_id": "original name" }

  // Build name → node-info lookup
  var nodeLookup = {};
  if (Array.isArray(nodeData)) {
    nodeData.forEach(function (n) { nodeLookup[n.name] = n; });
  }

  // ── Click handler (called by Mermaid click directives) ────────────────────
  window.explicarNodeClick = function (mermaidId) {
    var origName = idMap[mermaidId] || mermaidId;
    var node     = nodeLookup[origName] || { name: origName, type: "unknown" };
    showDetail(origName, node);
  };

  function showDetail(name, node) {
    var titleEl  = document.getElementById("ex-detail-title");
    var wrapEl   = document.getElementById("ex-detail-wrap");

    titleEl.textContent = name;

    // Node metadata card
    var badgeClass = {
      script: "ex-badge-script",
      variable: "ex-badge-variable",
      "function": "ex-badge-fn",
      source: "ex-badge-source"
    }[node.type] || "ex-badge-script";

    var metaHtml =
      '<div class="ex-node-meta">' +
      '  <h3><span class="ex-badge ' + badgeClass + '">' + esc(node.type) + '</span>' +
             esc(name) + '</h3>' +
      '  <div class="ex-meta-row">';

    if (node.file) metaHtml += 'File: <code>' + esc(node.file) + '</code><br>';
    if (node.line) metaHtml += 'Line: ' + node.line + '<br>';
    if (node.label && node.label !== name) metaHtml += 'Label: ' + esc(node.label) + '<br>';
    if (node.shape_info) metaHtml += 'Shape: ' + esc(node.shape_info) + '<br>';

    metaHtml += '  </div></div>';

    // Verb animation HTML (if any key starts with the node name)
    var verbHtml = "";
    Object.keys(verbData).forEach(function (key) {
      if (key.indexOf(name) !== -1) {
        verbHtml += verbData[key] || "";
      }
    });

    wrapEl.innerHTML = metaHtml + (verbHtml || '<p class="ex-hint">No verb details for this node.</p>');

    // Re-execute any embedded <script> tags (from htmltools widgets)
    Array.from(wrapEl.querySelectorAll("script")).forEach(function (old) {
      var fresh = document.createElement("script");
      if (old.src) { fresh.src = old.src; }
      else { fresh.textContent = old.textContent; }
      old.parentNode.replaceChild(fresh, old);
    });

    wrapEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ── Initialise Mermaid ────────────────────────────────────────────────────
  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "loose",   // needed for click callbacks
    theme: "default",
    flowchart: {
      curve: "basis",
      padding: 20
    }
  });
})();
</script>

</body>
</html>
