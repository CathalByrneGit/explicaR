<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #4A90D9;
      --green:  #7ED321;
      --orange: #F5A623;
      --purple: #9B59B6;
      --dark:   #1a1a2e;
      --bg:     #f8f9fa;
      --border: #dee2e6;
      --muted:  #6c757d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    .ex-header {
      background: var(--dark);
      color: #fff;
      padding: .75rem 1.25rem;
      border-bottom: 3px solid var(--blue);
      flex: 0 0 auto;
    }
    .ex-header h1 { font-size: 1.25rem; font-weight: 700; }
    .ex-stats {
      font-size: .8rem;
      color: #aab;
      margin-top: .2rem;
    }

    /* ── Main two-panel layout ── */
    .ex-main {
      display: flex;
      flex: 1 1 0;
      overflow: hidden;
    }

    .ex-graph-panel {
      flex: 0 0 60%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border);
      background: #fff;
      overflow: hidden;
    }

    .ex-detail-panel {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .ex-panel-title {
      font-size: .85rem;
      font-weight: 700;
      color: var(--dark);
      padding: .5rem .85rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
      flex: 0 0 auto;
    }

    /* ── Mermaid graph container ── */
    #ex-graph-wrap {
      flex: 1 1 0;
      overflow: auto;
      padding: .5rem;
      cursor: pointer;
    }
    #ex-graph-wrap .mermaid {
      min-height: 100%;
    }

    /* ── Expand button ── */
    #ex-expand-btn {
      position: absolute; top: .4rem; right: .4rem;
      background: rgba(255,255,255,.9); border: 1px solid var(--border);
      border-radius: 4px; padding: .2rem .45rem; font-size: .75rem;
      cursor: pointer; color: var(--muted); z-index: 10;
      line-height: 1.4;
    }
    #ex-expand-btn:hover { background: #fff; color: #333; }

    /* ── Full-screen modal ── */
    #ex-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); z-index: 1000;
      align-items: center; justify-content: center;
    }
    #ex-modal.open { display: flex; }
    #ex-modal-box {
      width: 92vw; height: 88vh;
      background: #fff; border-radius: 8px;
      display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.35);
    }
    #ex-modal-toolbar {
      display: flex; align-items: center; gap: .4rem;
      padding: .4rem .6rem; border-bottom: 1px solid var(--border);
      flex: 0 0 auto; background: #fafafa;
    }
    #ex-modal-toolbar button {
      background: #fff; border: 1px solid var(--border);
      border-radius: 4px; padding: .2rem .55rem;
      font-size: .8rem; cursor: pointer; line-height: 1.5;
    }
    #ex-modal-toolbar button:hover { background: #f0f0f0; }
    #ex-modal-toolbar .sep { flex: 1; }
    #ex-modal-viewport {
      flex: 1 1 0; overflow: hidden; position: relative;
      cursor: grab; user-select: none;
    }
    #ex-modal-viewport.dragging { cursor: grabbing; }
    #ex-svg-stage {
      position: absolute; top: 0; left: 0;
      transform-origin: 0 0;
    }

    /* ── Detail panel ── */
    #ex-detail-wrap {
      flex: 1 1 0;
      overflow-y: auto;
      padding: .75rem;
    }

    .ex-hint {
      font-size: .82rem;
      color: var(--muted);
      font-style: italic;
      padding: .5rem 0;
    }

    .ex-node-meta {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .75rem;
      margin-bottom: .75rem;
    }
    .ex-node-meta h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: .35rem;
    }
    .ex-meta-row {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .ex-badge {
      display: inline-block;
      padding: .1rem .4rem;
      border-radius: 3px;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-right: .3rem;
    }
    .ex-badge-script   { background: var(--blue);   color: #fff; }
    .ex-badge-variable { background: var(--green);  color: #fff; }
    .ex-badge-fn       { background: var(--orange); color: #000; }
    .ex-badge-source   { background: var(--purple); color: #fff; }

    /* ── Footer ── */
    .ex-footer {
      flex: 0 0 auto;
      padding: .35rem 1rem;
      font-size: .72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: #fff;
      text-align: center;
    }
    .ex-footer a { color: var(--blue); text-decoration: none; }

    /* ── Legend strip ── */
    .ex-legend {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      padding: .35rem .85rem;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      flex: 0 0 auto;
    }
    .ex-legend-item {
      font-size: .72rem;
      display: flex;
      align-items: center;
      gap: .3rem;
    }
    .ex-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    @media (max-width: 700px) {
      .ex-main { flex-direction: column; }
      .ex-graph-panel { flex: 0 0 50vh; border-right: none; border-bottom: 2px solid var(--border); }
    }
  </style>
</head>
<body>

<header class="ex-header">
  <h1>{{TITLE}}</h1>
  <p class="ex-stats">{{STATS}}</p>
</header>

<main class="ex-main">

  <section class="ex-graph-panel" style="position:relative">
    <div class="ex-panel-title">
      Pipeline Graph
      <span style="font-weight:400;color:var(--muted);margin-left:.5rem">
        — click a node for details
      </span>
    </div>
    <div class="ex-legend">
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#4A90D9"></span>Script
      </span>
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#7ED321"></span>Variable
      </span>
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#F5A623"></span>Function
      </span>
      <span class="ex-legend-item">
        <span class="ex-legend-dot" style="background:#9B59B6"></span>Source file
      </span>
    </div>
    <button id="ex-expand-btn" title="Expand graph">&#x26F6; Expand</button>
    <div id="ex-graph-wrap">
      <div class="mermaid" id="ex-graph">
{{MERMAID_GRAPH}}
      </div>
    </div>
  </section>

  <!-- Full-screen graph modal -->
  <div id="ex-modal">
    <div id="ex-modal-box">
      <div id="ex-modal-toolbar">
        <button id="ex-zoom-out" title="Zoom out">&#x2212;</button>
        <button id="ex-zoom-fit" title="Fit to screen">&#x25A3; Fit</button>
        <button id="ex-zoom-in"  title="Zoom in">&#x2B;</button>
        <span style="font-size:.75rem;color:var(--muted);margin-left:.25rem" id="ex-zoom-label">100%</span>
        <span class="sep"></span>
        <button id="ex-modal-close">&#x2715; Close</button>
      </div>
      <div id="ex-modal-viewport">
        <div id="ex-svg-stage"></div>
      </div>
    </div>
  </div>

  <section class="ex-detail-panel">
    <div style="display:flex;border-bottom:1px solid var(--border);background:#fff;flex:0 0 auto">
      <button class="ex-vtab active" data-vtab="detail" style="padding:.4rem .85rem;font-size:.8rem;font-weight:600;cursor:pointer;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted)">Detail</button>
      <button class="ex-vtab" data-vtab="wiki" id="ex-wiki-tab" style="padding:.4rem .85rem;font-size:.8rem;font-weight:600;cursor:pointer;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted)">Wiki</button>
    </div>
    <div class="ex-vtab-content active" id="vtab-detail" style="flex:1 1 0;display:flex;flex-direction:column;overflow:hidden">
      <div id="ex-detail-wrap" style="flex:1 1 0;overflow-y:auto;padding:.75rem">
        <p class="ex-hint">Click a node in the graph to see details here.</p>
      </div>
    </div>
    <div class="ex-vtab-content" id="vtab-wiki" style="flex:1 1 0;display:none;flex-direction:column;overflow:hidden">
      <div id="ex-wiki-wrap" style="flex:1 1 0;overflow-y:auto;padding:.75rem">
        <p class="ex-hint">Click a script node to see its wiki page.</p>
      </div>
    </div>
  </section>

</main>

<footer class="ex-footer">
  Generated by
  <a href="https://github.com/CathalByrneGit/explicaR">explicaR</a>
  &nbsp;&middot;&nbsp; {{GENERATED_AT}}
</footer>

<!-- Embedded data -->
<script type="application/json" id="ex-node-data">{{NODE_DATA_JSON}}</script>
<script type="application/json" id="ex-id-map">{{ID_MAP_JSON}}</script>
<script type="application/json" id="ex-wiki-data">{{WIKI_DATA_JSON}}</script>

<!-- Mermaid.js (requires internet connection to render the graph) -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

<script>
(function () {
  "use strict";

  // ── Data ──────────────────────────────────────────────────────────────────
  function loadJSON(id) {
    var el = document.getElementById(id);
    if (!el) return {};
    try { return JSON.parse(el.textContent); } catch (e) { return {}; }
  }

  var nodeData = loadJSON("ex-node-data");   // [ { name, type, file, line, ... } ]
  var idMap    = loadJSON("ex-id-map");      // { "Mermaid_id": "original name" }
  var wikiData = loadJSON("ex-wiki-data");   // { "/path/to/file.R": "markdown..." }

  // Build name → node-info lookup
  var nodeLookup = {};
  if (Array.isArray(nodeData)) {
    nodeData.forEach(function (n) { nodeLookup[n.name] = n; });
  }

  // ── Viewer tab switching ───────────────────────────────────────────────────
  document.querySelectorAll(".ex-vtab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".ex-vtab").forEach(function (b) {
        b.classList.remove("active");
        b.style.color = "var(--muted)";
        b.style.borderBottomColor = "transparent";
      });
      document.querySelectorAll(".ex-vtab-content").forEach(function (c) {
        c.classList.remove("active");
        c.style.display = "none";
      });
      btn.classList.add("active");
      btn.style.color = "var(--blue)";
      btn.style.borderBottomColor = "var(--blue)";
      var target = document.getElementById("vtab-" + btn.dataset.vtab);
      if (target) { target.classList.add("active"); target.style.display = "flex"; }
    });
  });

  // ── Click handler (called by Mermaid click directives) ────────────────────
  window.explicarNodeClick = function (mermaidId) {
    var origName = idMap[mermaidId] || mermaidId;
    var node     = nodeLookup[origName] || { name: origName, type: "unknown" };
    showDetail(origName, node);
    if (node.type === "script") showWikiPage(node.file || origName);
  };

  function showDetail(name, node) {
    var wrapEl = document.getElementById("ex-detail-wrap");
    var badgeClass = {
      script: "ex-badge-script",
      variable: "ex-badge-variable",
      "function": "ex-badge-fn",
      source: "ex-badge-source"
    }[node.type] || "ex-badge-script";

    var metaHtml =
      '<div class="ex-node-meta">' +
      '  <h3><span class="ex-badge ' + badgeClass + '">' + esc(node.type) + '</span>' +
             esc(name) + '</h3>' +
      '  <div class="ex-meta-row">';

    if (node.file) metaHtml += 'File: <code>' + esc(node.file) + '</code><br>';
    if (node.line) metaHtml += 'Line: ' + node.line + '<br>';
    if (node.label && node.label !== name) metaHtml += 'Label: ' + esc(node.label) + '<br>';
    if (node.shape_info) metaHtml += 'Shape: ' + esc(node.shape_info) + '<br>';

    metaHtml += '  </div></div>';
    wrapEl.innerHTML = metaHtml;
    wrapEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function showWikiPage(fileKey) {
    var wikiWrap = document.getElementById("ex-wiki-wrap");
    var content  = wikiData[fileKey] || null;
    if (!content) {
      wikiWrap.innerHTML = '<p class="ex-hint">No wiki page for this file.' +
        ' Run <code>explicar_wiki_build()</code> to generate one.</p>';
    } else {
      wikiWrap.innerHTML = '<div style="font-size:.82rem;line-height:1.6">' +
        markdownToHtml(content) + '</div>';
    }
  }

  function markdownToHtml(md) {
    return md
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/```[\w]*\n([\s\S]*?)```/g, function (_, c) {
        return "<pre style='background:var(--code);padding:.4rem;border-radius:3px;overflow-x:auto;font-size:.75rem'><code>" + c + "</code></pre>";
      })
      .replace(/`([^`]+)`/g, "<code style='background:var(--code);padding:.05rem .2rem;border-radius:2px'>$1</code>")
      .replace(/^### (.+)$/gm, "<h3 style='font-size:.88rem;margin:.5rem 0 .2rem'>$1</h3>")
      .replace(/^## (.+)$/gm,  "<h2 style='font-size:.95rem;margin:.7rem 0 .3rem'>$1</h2>")
      .replace(/^# (.+)$/gm,   "<h2 style='font-size:.95rem;margin:.7rem 0 .3rem'>$1</h2>")
      .replace(/^\- (.+)$/gm,  "<li style='margin:.1rem 0'>$1</li>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n\n/g, "<br><br>");
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ── Initialise Mermaid ────────────────────────────────────────────────────
  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "loose",   // needed for click callbacks
    theme: "default",
    maxTextSize: 500000,
    flowchart: {
      curve: "basis",
      padding: 20
    }
  });

  // ── Full-screen pan/zoom modal ─────────────────────────────────────────────
  (function () {
    var modal    = document.getElementById("ex-modal");
    var stage    = document.getElementById("ex-svg-stage");
    var viewport = document.getElementById("ex-modal-viewport");
    var label    = document.getElementById("ex-zoom-label");

    var tx = 0, ty = 0, scale = 1;
    var naturalW = 0, naturalH = 0;

    function applyTransform() {
      stage.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
      label.textContent = Math.round(scale * 100) + "%";
    }

    function fitToViewport() {
      if (!naturalW || !naturalH) return;
      var vw = viewport.clientWidth, vh = viewport.clientHeight;
      scale = Math.min(vw / naturalW, vh / naturalH) * 0.92;
      tx = (vw - naturalW * scale) / 2;
      ty = (vh - naturalH * scale) / 2;
      applyTransform();
    }

    function openModal() {
      var src = document.querySelector("#ex-graph svg");
      if (!src) return;
      // Capture pixel dimensions before cloning (getBBox uses internal coords)
      var srcRect = src.getBoundingClientRect();
      naturalW = srcRect.width;
      naturalH = srcRect.height;
      stage.innerHTML = "";
      var clone = src.cloneNode(true);
      // Pin explicit px dimensions so width:100% doesn't stretch to fill viewport
      clone.setAttribute("width", naturalW);
      clone.setAttribute("height", naturalH);
      clone.style.width = naturalW + "px";
      clone.style.height = naturalH + "px";
      clone.style.maxWidth = "none";
      stage.appendChild(clone);
      // Re-attach click handlers on cloned nodes
      stage.querySelectorAll("[id]").forEach(function (el) {
        var oid = el.getAttribute("data-mermaid-id") || el.id;
        if (oid) el.addEventListener("click", function () {
          window.explicarNodeClick(oid);
          closeModal();
        });
      });
      modal.classList.add("open");
      setTimeout(fitToViewport, 60);
    }

    function closeModal() { modal.classList.remove("open"); }

    document.getElementById("ex-expand-btn").addEventListener("click", openModal);
    document.getElementById("ex-graph-wrap").addEventListener("dblclick", openModal);
    document.getElementById("ex-modal-close").addEventListener("click", closeModal);
    modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

    document.getElementById("ex-zoom-in") .addEventListener("click", function () { zoom(1.25, viewport.clientWidth/2, viewport.clientHeight/2); });
    document.getElementById("ex-zoom-out").addEventListener("click", function () { zoom(0.8,  viewport.clientWidth/2, viewport.clientHeight/2); });
    document.getElementById("ex-zoom-fit").addEventListener("click", fitToViewport);

    // Scroll to zoom (cursor-centred)
    viewport.addEventListener("wheel", function (e) {
      e.preventDefault();
      var factor = e.deltaY < 0 ? 1.12 : 0.89;
      var rect = viewport.getBoundingClientRect();
      zoom(factor, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    function zoom(factor, mx, my) {
      tx = mx - (mx - tx) * factor;
      ty = my - (my - ty) * factor;
      scale *= factor;
      applyTransform();
    }

    // Pan
    var dragging = false, startX, startY, startTx, startTy;
    viewport.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      dragging = true; startX = e.clientX; startY = e.clientY;
      startTx = tx; startTy = ty;
      viewport.classList.add("dragging");
    });
    window.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      applyTransform();
    });
    window.addEventListener("mouseup", function () {
      dragging = false;
      viewport.classList.remove("dragging");
    });

    // Keyboard: Esc closes, +/- zoom
    window.addEventListener("keydown", function (e) {
      if (!modal.classList.contains("open")) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "+" || e.key === "=") zoom(1.15, viewport.clientWidth/2, viewport.clientHeight/2);
      if (e.key === "-") zoom(0.87, viewport.clientWidth/2, viewport.clientHeight/2);
      if (e.key === "0") fitToViewport();
    });
  })();
})();
</script>

</body>
</html>
