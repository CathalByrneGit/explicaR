<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #4A90D9;
      --green:  #7ED321;
      --orange: #F5A623;
      --purple: #9B59B6;
      --dark:   #1a1a2e;
      --bg:     #f8f9fa;
      --border: #dee2e6;
      --muted:  #6c757d;
      --code:   #e9ecef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    .ex-header {
      background: var(--dark);
      color: #fff;
      padding: .75rem 1.25rem;
      border-bottom: 3px solid var(--blue);
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .ex-header h1 { font-size: 1.25rem; font-weight: 700; }
    .ex-stats { font-size: .8rem; color: #aab; }
    .ex-db-status {
      margin-left: auto;
      font-size: .75rem;
      padding: .15rem .5rem;
      border-radius: 10px;
      background: #333;
      color: #aab;
      display: flex;
      align-items: center;
      gap: .35rem;
    }
    .ex-db-status::before {
      content: "";
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
    }
    .ex-db-status.ready::before  { background: var(--green); }
    .ex-db-status.error::before  { background: #e74c3c; }

    /* ── Main layout ── */
    .ex-main {
      display: flex;
      flex: 1 1 0;
      overflow: hidden;
    }

    .ex-graph-panel {
      flex: 0 0 55%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border);
      background: #fff;
      overflow: hidden;
    }

    .ex-right-panel {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .ex-panel-title {
      font-size: .85rem;
      font-weight: 700;
      color: var(--dark);
      padding: .5rem .85rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
      flex: 0 0 auto;
    }

    /* ── Graph ── */
    #ex-graph-wrap {
      flex: 1 1 0;
      overflow: auto;
      padding: .5rem;
    }
    #ex-graph-wrap .mermaid { min-height: 100%; }

    /* ── Legend ── */
    .ex-legend {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      padding: .35rem .85rem;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      flex: 0 0 auto;
    }
    .ex-legend-item { font-size: .72rem; display: flex; align-items: center; gap: .3rem; }
    .ex-legend-dot  { width: 10px; height: 10px; border-radius: 2px; }

    /* ── Tabs ── */
    .ex-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #fff;
      flex: 0 0 auto;
    }
    .ex-tab {
      padding: .45rem 1rem;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
    }
    .ex-tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }
    .ex-tab-content { display: none; flex: 1 1 0; flex-direction: column; overflow: hidden; }
    .ex-tab-content.active { display: flex; }

    /* ── Detail panel ── */
    #ex-detail-wrap {
      flex: 1 1 0;
      overflow-y: auto;
      padding: .75rem;
    }
    .ex-hint {
      font-size: .82rem;
      color: var(--muted);
      font-style: italic;
      padding: .5rem 0;
    }
    .ex-node-meta {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .75rem;
      margin-bottom: .75rem;
    }
    .ex-node-meta h3 { font-size: 1rem; font-weight: 700; margin-bottom: .35rem; }
    .ex-meta-row { font-size: .8rem; color: var(--muted); line-height: 1.6; }
    .ex-badge {
      display: inline-block;
      padding: .1rem .4rem;
      border-radius: 3px;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-right: .3rem;
    }
    .ex-badge-script   { background: var(--blue);   color: #fff; }
    .ex-badge-variable { background: var(--green);  color: #fff; }
    .ex-badge-fn       { background: var(--orange); color: #000; }
    .ex-badge-source   { background: var(--purple); color: #fff; }

    /* ── Query panel ── */
    .ex-query-panel { flex: 1 1 0; display: flex; flex-direction: column; padding: .6rem; gap: .4rem; overflow: hidden; }

    .ex-quick-btns {
      display: flex;
      gap: .35rem;
      flex-wrap: wrap;
      flex: 0 0 auto;
    }
    .ex-quick-btn {
      font-size: .72rem;
      padding: .2rem .55rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      color: var(--dark);
    }
    .ex-quick-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }

    #ex-sql-input {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: .78rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .4rem .5rem;
      resize: vertical;
      flex: 0 0 auto;
      min-height: 60px;
      max-height: 160px;
      background: var(--code);
    }

    .ex-query-actions {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex: 0 0 auto;
    }
    #ex-run-btn {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: .35rem .9rem;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
    }
    #ex-run-btn:disabled { opacity: .5; cursor: not-allowed; }
    #ex-query-error {
      font-size: .78rem;
      color: #e74c3c;
      flex: 1;
    }

    /* ── Results table ── */
    #ex-results-wrap {
      flex: 1 1 0;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
    }
    #ex-results-count { font-size: .72rem; color: var(--muted); flex: 0 0 auto; }
    .ex-results-table {
      border-collapse: collapse;
      width: 100%;
      font-size: .78rem;
    }
    .ex-results-table th,
    .ex-results-table td {
      border-bottom: 1px solid var(--border);
      padding: .25rem .5rem;
      text-align: left;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ex-results-table thead { background: #e9ecef; position: sticky; top: 0; }
    .ex-results-table tbody tr { cursor: pointer; }
    .ex-results-table tbody tr:hover { background: #f0f4ff; }
    .ex-results-table tbody tr.selected { background: #dbeafe; }

    /* ── Footer ── */
    .ex-footer {
      flex: 0 0 auto;
      padding: .35rem 1rem;
      font-size: .72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: #fff;
      text-align: center;
    }
    .ex-footer a { color: var(--blue); text-decoration: none; }

    @media (max-width: 700px) {
      .ex-main { flex-direction: column; }
      .ex-graph-panel { flex: 0 0 45vh; border-right: none; border-bottom: 2px solid var(--border); }
    }
  </style>
</head>
<body>

<header class="ex-header">
  <h1>{{TITLE}}</h1>
  <span class="ex-stats">{{STATS}}</span>
  <span class="ex-db-status" id="ex-db-status">Initializing DuckDB…</span>
</header>

<main class="ex-main">

  <!-- Left: Mermaid graph -->
  <section class="ex-graph-panel">
    <div class="ex-panel-title">
      Pipeline Graph
      <span style="font-weight:400;color:var(--muted);margin-left:.5rem">— click a node</span>
    </div>
    <div class="ex-legend">
      <span class="ex-legend-item"><span class="ex-legend-dot" style="background:#4A90D9"></span>Script</span>
      <span class="ex-legend-item"><span class="ex-legend-dot" style="background:#7ED321"></span>Variable</span>
      <span class="ex-legend-item"><span class="ex-legend-dot" style="background:#F5A623"></span>Function</span>
      <span class="ex-legend-item"><span class="ex-legend-dot" style="background:#9B59B6"></span>Source</span>
    </div>
    <div id="ex-graph-wrap">
      <div class="mermaid" id="ex-graph">
{{MERMAID_GRAPH}}
      </div>
    </div>
  </section>

  <!-- Right: tabbed Detail + Query -->
  <section class="ex-right-panel">
    <div class="ex-tabs">
      <button class="ex-tab active" data-tab="detail">Detail</button>
      <button class="ex-tab" data-tab="query">SQL Query</button>
    </div>

    <!-- Detail tab -->
    <div class="ex-tab-content active" id="tab-detail">
      <div id="ex-detail-wrap">
        <p class="ex-hint">Click a node in the graph to see details here.</p>
      </div>
    </div>

    <!-- Query tab -->
    <div class="ex-tab-content" id="tab-query">
      <div class="ex-query-panel">
        <div class="ex-quick-btns">
          <button class="ex-quick-btn" data-q="SELECT name, type, file, line FROM nodes ORDER BY type, name LIMIT 50">All nodes</button>
          <button class="ex-quick-btn" data-q="SELECT name, file, line FROM nodes WHERE type = 'function' ORDER BY name">Functions</button>
          <button class="ex-quick-btn" data-q="SELECT name, file, line, shape_info FROM nodes WHERE type = 'variable' ORDER BY name">Variables</button>
          <button class="ex-quick-btn" data-q="SELECT from_node, to_node, type FROM edges ORDER BY type, from_node LIMIT 50">Edges</button>
          <button class="ex-quick-btn" data-q="SELECT e.from_node, COUNT(*) AS out_degree FROM edges e GROUP BY e.from_node ORDER BY out_degree DESC LIMIT 10">Most connected</button>
          <button class="ex-quick-btn" data-q="SELECT fn_name, input_var, output_var, file, line FROM verbs ORDER BY file, line">Verb calls</button>
        </div>
        <textarea id="ex-sql-input" rows="3" spellcheck="false">SELECT name, type, file, line FROM nodes ORDER BY type, name LIMIT 50</textarea>
        <div class="ex-query-actions">
          <button id="ex-run-btn" disabled>Run ▶</button>
          <span id="ex-query-error"></span>
        </div>
        <div id="ex-results-count"></div>
        <div id="ex-results-wrap">
          <p class="ex-hint" style="padding:.5rem">DuckDB initializing…</p>
        </div>
      </div>
    </div>

  </section>

</main>

<footer class="ex-footer">
  Generated by
  <a href="https://github.com/CathalByrneGit/explicaR">explicaR</a>
  &nbsp;·&nbsp; Tier 2 (DuckDB-WASM)
  &nbsp;·&nbsp; {{GENERATED_AT}}
</footer>

<!-- Embedded data -->
<script type="application/json" id="ex-node-data">{{NODE_DATA_JSON}}</script>
<script type="application/json" id="ex-edge-data">{{EDGE_DATA_JSON}}</script>
<script type="application/json" id="ex-verb-data">{{VERB_DATA_JSON}}</script>
<script type="application/json" id="ex-id-map">{{ID_MAP_JSON}}</script>

<!-- Mermaid CDN -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

<!-- DuckDB-WASM via ESM -->
<script type="module">
import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@latest/+esm";

(async function () {
  "use strict";

  // ── Load embedded JSON ──────────────────────────────────────────────────────
  function loadJSON(id) {
    var el = document.getElementById(id);
    if (!el) return [];
    try { return JSON.parse(el.textContent); } catch (_) { return []; }
  }

  var nodeData = loadJSON("ex-node-data");   // [{name,type,file,line,label,shape_info}]
  var edgeData = loadJSON("ex-edge-data");   // [{from,to,type}]
  var verbData = loadJSON("ex-verb-data");   // [{file,line,fn_name,input_var,output_var,pkg}]
  var idMap    = loadJSON("ex-id-map");      // {"mermaid_id": "original_name"}

  var nodeLookup = {};
  if (Array.isArray(nodeData)) nodeData.forEach(function (n) { nodeLookup[n.name] = n; });

  // ── Tab switching ───────────────────────────────────────────────────────────
  document.querySelectorAll(".ex-tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".ex-tab").forEach(function (b) { b.classList.remove("active"); });
      document.querySelectorAll(".ex-tab-content").forEach(function (c) { c.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  // Quick query buttons
  document.querySelectorAll(".ex-quick-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.getElementById("ex-sql-input").value = btn.dataset.q;
      // Switch to query tab
      document.querySelectorAll(".ex-tab").forEach(function (b) { b.classList.remove("active"); });
      document.querySelectorAll(".ex-tab-content").forEach(function (c) { c.classList.remove("active"); });
      document.querySelector('[data-tab="query"]').classList.add("active");
      document.getElementById("tab-query").classList.add("active");
      runQuery();
    });
  });

  // ── Mermaid click callback ──────────────────────────────────────────────────
  window.explicarNodeClick = function (mermaidId) {
    var origName = idMap[mermaidId] || mermaidId;
    var node     = nodeLookup[origName] || { name: origName, type: "unknown" };
    // Switch to detail tab
    document.querySelectorAll(".ex-tab").forEach(function (b) { b.classList.remove("active"); });
    document.querySelectorAll(".ex-tab-content").forEach(function (c) { c.classList.remove("active"); });
    document.querySelector('[data-tab="detail"]').classList.add("active");
    document.getElementById("tab-detail").classList.add("active");
    showDetail(origName, node);
  };

  function showDetail(name, node) {
    var titleEl = document.querySelector('[data-tab="detail"]');
    var wrapEl  = document.getElementById("ex-detail-wrap");

    var badgeClass = { script: "ex-badge-script", variable: "ex-badge-variable",
      "function": "ex-badge-fn", source: "ex-badge-source" }[node.type] || "ex-badge-script";

    var html = '<div class="ex-node-meta">' +
      '<h3><span class="ex-badge ' + badgeClass + '">' + esc(node.type) + '</span>' + esc(name) + '</h3>' +
      '<div class="ex-meta-row">';
    if (node.file) html += "File: <code>" + esc(node.file) + "</code><br>";
    if (node.line) html += "Line: " + node.line + "<br>";
    if (node.label && node.label !== name) html += "Label: " + esc(node.label) + "<br>";
    if (node.shape_info) html += "Shape: " + esc(node.shape_info) + "<br>";
    html += "</div></div>";

    wrapEl.innerHTML = html;
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ── Initialise Mermaid ──────────────────────────────────────────────────────
  mermaid.initialize({ startOnLoad: true, securityLevel: "loose", theme: "default",
    flowchart: { curve: "basis", padding: 20 } });

  // ── Initialise DuckDB-WASM ──────────────────────────────────────────────────
  var db = null;
  var conn = null;
  var dbStatusEl = document.getElementById("ex-db-status");
  var runBtn     = document.getElementById("ex-run-btn");
  var errorEl    = document.getElementById("ex-query-error");

  try {
    dbStatusEl.textContent = "Loading DuckDB-WASM…";

    const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
    const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

    // Create worker via blob URL (avoids needing a separate worker file)
    const workerUrl = URL.createObjectURL(
      new Blob([`importScripts("${bundle.mainWorker}");`], { type: "text/javascript" })
    );
    const worker = new Worker(workerUrl);
    const logger = new duckdb.VoidLogger();

    db   = new duckdb.AsyncDuckDB(logger, worker);
    await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
    conn = await db.connect();

    // Load data into in-memory tables
    await conn.query(`
      CREATE TABLE nodes (
        name VARCHAR, type VARCHAR, file VARCHAR,
        line INTEGER, label VARCHAR, shape_info VARCHAR
      )
    `);
    await conn.query(`
      CREATE TABLE edges (from_node VARCHAR, to_node VARCHAR, type VARCHAR)
    `);
    await conn.query(`
      CREATE TABLE verbs (
        file VARCHAR, line INTEGER, fn_name VARCHAR,
        input_var VARCHAR, output_var VARCHAR, pkg VARCHAR
      )
    `);

    // Insert rows via parameterised batches
    if (nodeData.length > 0) {
      const vals = nodeData.map(function (n) {
        return "(" + [n.name, n.type, n.file || "", n.line || 0, n.label || n.name, n.shape_info || ""]
          .map(function (v) { return "'" + String(v).replace(/'/g, "''") + "'"; }).join(",") + ")";
      }).join(",");
      await conn.query("INSERT INTO nodes VALUES " + vals);
    }

    if (edgeData.length > 0) {
      const vals = edgeData.map(function (e) {
        return "('" + String(e.from || "").replace(/'/g, "''") + "','" +
               String(e.to   || "").replace(/'/g, "''") + "','" +
               String(e.type || "").replace(/'/g, "''") + "')";
      }).join(",");
      await conn.query("INSERT INTO edges VALUES " + vals);
    }

    if (verbData.length > 0) {
      const vals = verbData.map(function (v) {
        return "(" + [v.file, v.line || 0, v.fn_name, v.input_var, v.output_var, v.pkg]
          .map(function (x) { return "'" + String(x || "").replace(/'/g, "''") + "'"; }).join(",") + ")";
      }).join(",");
      await conn.query("INSERT INTO verbs VALUES " + vals);
    }

    dbStatusEl.textContent = "DuckDB ready ✓";
    dbStatusEl.classList.add("ready");
    runBtn.disabled = false;

    // Run the default query immediately
    runQuery();
    URL.revokeObjectURL(workerUrl);

  } catch (err) {
    dbStatusEl.textContent = "DuckDB unavailable";
    dbStatusEl.classList.add("error");
    document.getElementById("ex-results-wrap").innerHTML =
      '<p class="ex-hint" style="padding:.5rem;color:#e74c3c">DuckDB-WASM failed to load: ' + esc(err.message) + '</p>';
    console.error("DuckDB-WASM init error:", err);
  }

  // ── SQL query runner ────────────────────────────────────────────────────────
  runBtn.addEventListener("click", runQuery);
  document.getElementById("ex-sql-input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runQuery();
  });

  async function runQuery() {
    if (!conn) return;
    var sql = document.getElementById("ex-sql-input").value.trim();
    if (!sql) return;

    errorEl.textContent = "";
    runBtn.disabled = true;
    runBtn.textContent = "Running…";

    try {
      var result = await conn.query(sql);
      var schema = result.schema.fields.map(function (f) { return f.name; });
      var rows   = result.toArray();

      document.getElementById("ex-results-count").textContent =
        rows.length + " row" + (rows.length !== 1 ? "s" : "");

      if (rows.length === 0) {
        document.getElementById("ex-results-wrap").innerHTML =
          '<p class="ex-hint" style="padding:.5rem">Query returned 0 rows.</p>';
        return;
      }

      var thead = "<thead><tr>" + schema.map(function (c) {
        return "<th>" + esc(c) + "</th>";
      }).join("") + "</tr></thead>";

      var tbody = "<tbody>" + rows.map(function (row) {
        var cells = schema.map(function (col) {
          var v = row[col];
          return "<td title='" + esc(String(v == null ? "" : v)) + "'>" +
                 esc(String(v == null ? "" : v)) + "</td>";
        }).join("");
        return "<tr>" + cells + "</tr>";
      }).join("") + "</tbody>";

      document.getElementById("ex-results-wrap").innerHTML =
        '<table class="ex-results-table">' + thead + tbody + "</table>";

      // Clicking a row with a "name" column selects that node
      var nameIdx = schema.indexOf("name");
      if (nameIdx >= 0) {
        document.querySelectorAll("#ex-results-wrap tbody tr").forEach(function (tr, i) {
          tr.addEventListener("click", function () {
            document.querySelectorAll("#ex-results-wrap tbody tr").forEach(function (r) { r.classList.remove("selected"); });
            tr.classList.add("selected");
            var name = rows[i][schema[nameIdx]];
            if (name) {
              var node = nodeLookup[name] || { name: name, type: "unknown" };
              document.querySelectorAll(".ex-tab").forEach(function (b) { b.classList.remove("active"); });
              document.querySelectorAll(".ex-tab-content").forEach(function (c) { c.classList.remove("active"); });
              document.querySelector('[data-tab="detail"]').classList.add("active");
              document.getElementById("tab-detail").classList.add("active");
              showDetail(name, node);
            }
          });
        });
      }

    } catch (err) {
      errorEl.textContent = err.message;
      document.getElementById("ex-results-wrap").innerHTML = "";
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "Run ▶";
    }
  }

})();
</script>

</body>
</html>
